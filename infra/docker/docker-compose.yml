version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tech-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: tech-user-service
    environment:
      USER_DB_URL: jdbc:postgresql://postgres:5432/userdb
      USER_DB_USER: postgres
      USER_DB_PASSWORD: postgres
      USER_SERVICE_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    container_name: tech-order-service
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orderdb
      ORDER_DB_USER: postgres
      ORDER_DB_PASSWORD: postgres
      ORDER_SERVICE_PORT: 8082
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
